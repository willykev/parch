name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Arch Linux / x86_64
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git python curl qt6-base qt6-declarative qt6-svg qt6-wayland syntax-highlighting xdg-desktop-portal fontconfig hunspell hunspell-en_us libyaml librsvg cairo libzip poppler qpdf epubcheck ttf-dejavu
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create build user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Fetch the math and diagram helpers and the test fixtures
        run: |
          runuser -u builder -- bin/fetch-helpers
          runuser -u builder -- bin/fetch-test-fixtures
      - name: Build and test
        # A shared runner is no measure of a desktop: its responsiveness
        # limits are three times those the tests set on a desktop.
        env:
          PARCH_TEST_TIME_FACTOR: "3"
        run: |
          runuser -u builder -- bin/build
          runuser -u builder -- bin/test
          test "$(runuser -u builder -- build/parch --version)" = "parch $(cat VERSION)"
          test "$(runuser -u builder -- bash -c 'source pkgbuild/PKGBUILD && echo "$pkgver"')" = "$(cat VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          fi
      - name: Build Arch package
        working-directory: pkgbuild
        # The README downloads parch-writer-<arch>.pkg.tar.zst.
        env:
          PKGEXT: .pkg.tar.zst
        run: runuser -u builder -- makepkg --cleanbuild --force --nodeps --noconfirm
      - name: Check the packaged binary
        working-directory: pkgbuild
        run: |
          binary=$(mktemp)
          trap 'rm -f "$binary"' EXIT
          bsdtar -xOf parch-writer-*-"$(uname -m)".pkg.tar.zst usr/bin/parch > "$binary"
          readelf -dW "$binary" | grep BIND_NOW
          readelf --dyn-syms --wide "$binary" | grep -E ' UND +__[[:alnum:]_]+_chk(@|$)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: parch-x86_64
          path: pkgbuild/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 14

  attach:
    # A release tag's x86_64 package joins the release bin/release publishes
    # with the aarch64 one, with its checksum.
    name: Attach the x86_64 package to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: parch-x86_64
          path: package
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd package
          # The package again under a name without its version, as
          # bin/release gives the aarch64 one, for releases/latest/download.
          cp parch-writer-*-x86_64.pkg.tar.zst parch-writer-x86_64.pkg.tar.zst
          sha256sum *.pkg.tar.zst > SHA256SUMS-x86_64
          # bin/release creates the release just after it pushes the tag.
          for attempt in {1..40}; do
            if release=$(gh release view "$GITHUB_REF_NAME" --json assets); then break; fi
            if (( attempt == 40 )); then exit 1; fi
            sleep 30
          done
          missing=()
          for file in *.pkg.tar.zst SHA256SUMS-x86_64; do
            asset=$(jq -c --arg name "$file" '.assets[] | select(.name == $name)' <<< "$release")
            if [[ -z "$asset" ]]; then
              missing+=("$file")
              continue
            fi
            sum=$(sha256sum "$file")
            if [[ $(jq -r '.digest' <<< "$asset") != "sha256:${sum%% *}" ]]; then
              echo "Cannot attach $file. The existing release asset has a different or missing SHA-256 digest." >&2
              exit 1
            fi
          done
          if (( ${#missing[@]} )); then
            gh release upload "$GITHUB_REF_NAME" "${missing[@]}"
          fi
